global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Spring Boot application ──────────────────────────────
  - job_name: spring-boot-workspace
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          # Docker service name — the app runs inside the compose network
          - rest-service:8080
        labels:
          application: spring-boot-workspace

