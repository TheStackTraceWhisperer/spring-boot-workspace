spring:
  application:
    name: spring-boot-workspace
  datasource:
    url: jdbc:postgresql://localhost:5432/workspace
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
        spring.data.repository.invocations: 0.5,0.95,0.99
      slo:
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,5s
    tags:
      application: ${spring.application.name}

server:
  tomcat:
    mbeanregistry:
      enabled: true

